name: 🚀 Deploy Backend to AWS EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # 🧩 Create clean archive (NO node_modules, NO uploads)
      - name: Create deployment archive
        run: git archive --format=tar.gz HEAD -o deploy.tar.gz

      # 📤 Upload bundle
      - name: Upload backend bundle to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "deploy.tar.gz"
          target: "${{ secrets.APP_DIR }}"
          overwrite: true
          rm: false

      # 🚀 Extract & restart
      - name: Deploy & Restart PM2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ${{ secrets.APP_DIR }}
            tar -xzf deploy.tar.gz

            # Create/update .env file with GitHub secrets
            cat > .env << 'EOF'
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRE=7d
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            REFRESH_TOKEN_EXPIRATION=${{secrets.REFRESH_TOKEN_EXPIRATION}}
            REFRESH_TOKEN_SECRET=${{secrets.REFRESH_TOKEN_SECRET}}
            NODE_ENV=${{secrets.NODE_ENV}}
            STORAGE_PROVIDER=${{secrets.STORAGE_PROVIDER}}
            CLOUDINARY_CLOUD_NAME=${{secrets.CLOUDINARY_CLOUD_NAME}}
            CLOUDINARY_API_KEY=${{secrets.CLOUDINARY_API_KEY}}
            CLOUDINARY_API_SECRET=${{secrets.CLOUDINARY_API_SECRET}}
            PORT=${{secrets.PORT}}
            EOF

            npm install --production
            pm2 restart backend
            pm2 save
