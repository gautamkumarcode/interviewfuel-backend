name: 🚀 Deploy Backend to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # 🛡️ SAFELY CLEAN SERVER (keep .env, uploads, node_modules)
      - name: Clean backend folder on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ${{ secrets.BACKEND_DIR }}

            # Remove everything EXCEPT important files
            shopt -s extglob
            rm -rf !(node_modules|uploads|.env)

      # 📤 Upload backend code (without node_modules)
      - name: Upload backend to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "./"
          target: "${{ secrets.BACKEND_DIR }}"
          overwrite: true
          rm: false
          exclude: "node_modules"

      # 🚀 Install and restart backend
      - name: Start backend using PM2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ${{ secrets.BACKEND_DIR }}

            npm install --production

            pm2 stop backend || true
            pm2 start server.js --name backend
            pm2 save
