name: 🚀 Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
      uses: actions/checkout@v4

      - name: Remove files we never want to upload
        run: |
          rm -rf node_modules
          rm -rf .git
          rm -rf .github
          rm -rf tests

      - name: Prepare EC2 directory (keep .env)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ${{ secrets.APP_DIR }}
            find . -mindepth 1 ! -name ".env" -exec rm -rf {} +

      - name: Upload backend files (only clean source)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "."
          target: "${{ secrets.APP_DIR }}"
          overwrite: true
          rm: false

      - name: Install + Restart Backend
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ${{ secrets.APP_DIR }}
            npm install --production
            pm2 stop backend || true
            pm2 start server.js --name backend
            pm2 save
