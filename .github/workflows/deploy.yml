name: 🚀 Deploy Backend to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # 📤 Upload new backend files to EC2 (DO NOT DELETE ANY FILE)
      - name: Upload backend to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "./"
          target: "${{ secrets.BACKEND_DIR }}"
          overwrite: true       # only replace files that exist
          rm: false             # DO NOT remove remote files
          exclude: "node_modules"   # don't upload node_modules from GitHub

      # 🚀 Install & restart backend safely
      - name: Start backend using PM2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ${{ secrets.BACKEND_DIR }}

            npm install --production

            pm2 stop backend || true
            pm2 start server.js --name backend
            pm2 save
