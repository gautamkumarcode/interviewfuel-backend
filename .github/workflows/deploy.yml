name: 🚀 Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Cleanup old build but keep env
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ${{ secrets.APP_DIR }}

            # Keep env safe
            mv .env /tmp/env_backup 2>/dev/null || true
            mv .env.local /tmp/envlocal_backup 2>/dev/null || true

            # Clean everything
            sudo rm -rf ./*

            # Restore env
            mv /tmp/env_backup .env 2>/dev/null || true
            mv /tmp/envlocal_backup .env.local 2>/dev/null || true

      - name: Upload backend code
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "."
          target: "${{ secrets.APP_DIR }}"
          overwrite: true
          rm: false

      - name: Restart Backend
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ${{ secrets.APP_DIR }}

            npm install
            pm2 stop backend || true
            pm2 start server.js --name backend
            pm2 save
