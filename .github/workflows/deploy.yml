name: 🚀 Deploy Backend to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # 🧩 Create clean archive (NO node_modules, NO uploads)
      - name: Create deployment archive
        run: git archive --format=tar.gz HEAD -o deploy.tar.gz

      # 📤 Upload bundle
      - name: Upload backend bundle to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "deploy.tar.gz"
          target: "${{ secrets.APP_DIR }}"
          overwrite: true
          rm: false

      # 🚀 Extract & restart
      - name: Deploy & Restart PM2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ${{ secrets.APP_DIR }}
            tar -xzf deploy.tar.gz

            # Create/update .env file with GitHub secrets
            cat > .env << 'EOF'
            MONGO_URI=${{ secrets.MONGO_URI }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRE=7d
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            NODE_ENV=production
            PORT=5000
            EOF

            npm install --production

            pm2 stop backend || true
            pm2 start server.js --name backend
            pm2 save
